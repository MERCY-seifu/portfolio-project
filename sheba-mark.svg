<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <style>
    .steam {
      animation: steam-rise 2.6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }
    .steam:nth-of-type(2) { animation-delay: 0.8s; }
    .steam:nth-of-type(3) { animation-delay: 1.6s; }
    @keyframes steam-rise {
      0%, 100% { opacity: 0.2; transform: translateY(2px) scaleY(0.85); }
      45% { opacity: 1; }
      70% { opacity: 0.7; transform: translateY(-2px) scaleY(1.08); }
    }
    @media (prefers-reduced-motion: reduce) {
      .steam { animation: none; opacity: 0.8; }
    }
  </style>
